<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10192b">
<title>台灣賓果・超級獎號研究室</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#eef4ff;background:#0d1422;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#182949,#162034 65%,#282342);border-bottom:1px solid #32415a;padding:24px max(16px,calc((100% - 1120px)/2))}h1{margin:0;font-size:26px}header p{margin:7px 0 0;color:#afbed5}main{max-width:1120px;margin:auto;padding:16px}.toolbar,.tabs,.actions,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar{margin:12px 0}.tabs{padding:10px;background:#141f32;border:1px solid #2a3850;border-radius:13px}.tabs button{background:#26354d}.tabs button.active{background:#356ee0}button,input{font:inherit;color:inherit;border:1px solid #40516b;background:#1b2940;border-radius:9px;padding:9px 12px}button{cursor:pointer;background:#356ee0;border:0}button.secondary{background:#2a3a53}.card{background:#162238;border:1px solid #293a53;border-radius:14px;padding:16px;margin:12px 0;min-width:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.metric{font-size:25px;font-weight:750;color:#9bc1ff}.muted,.tiny{color:#aebbd0;font-size:13px}.tiny{font-size:12px}.warn{border-left:3px solid #e5b45d;background:#2a2b31;padding:10px 12px;border-radius:7px;color:#e8d5a9}.ball{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;margin:3px;border-radius:50%;background:linear-gradient(145deg,#4987f6,#285ac2);font-weight:750;box-shadow:inset 0 1px 2px #ffffff30}.ball.gold{background:linear-gradient(145deg,#ffd36b,#cf871d);color:#1e2633}.balls{display:flex;flex-wrap:wrap;gap:3px}.grid80{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}.heat{padding:8px 2px;text-align:center;border-radius:8px;border:1px solid #40516b;font-weight:700;background:#23324a}.heat.hot{background:#6e333d}.heat.cold{background:#235064}.heat small{display:block;font-size:10px;font-weight:400;color:#d4deed}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #33435b}td{white-space:nowrap}.scroll{overflow:auto;max-height:480px}.hidden{display:none}.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.error{color:#ffaaaa;white-space:pre-wrap}.tag{display:inline-block;border:1px solid #495d79;border-radius:8px;padding:4px 8px;margin:3px}footer{max-width:1120px;margin:auto;padding:10px 16px 28px;color:#9caac0;font-size:12px;text-align:center}label.upload{display:inline-flex;gap:6px;align-items:center;cursor:pointer;padding:9px 12px;border-radius:9px;background:#2a3a53}input[type=file]{display:none}@media(max-width:620px){header{padding:19px 15px}main{padding:10px}.card{padding:13px}.ball{width:36px;height:36px}.grid80{gap:4px}.heat{padding:6px 1px;font-size:12px}.heat small{font-size:9px}}
</style>
</head>
<body>
<header><h1>🔵 台灣賓果・超級獎號研究室</h1><p>開獎紀錄｜每期超級獎號｜下期 5 碼統計候選｜歷史回測</p></header>
<main>
  <div class="toolbar"><button id="reload">重新載入資料</button><button class="secondary" id="export">匯出 CSV 備份</button><label class="upload">匯入更新 CSV<input id="file" type="file" accept=".csv,.txt"></label><span class="muted" id="status">正在載入資料…</span></div>
  <div class="card"><div class="warn">超級獎號候選是依歷史開出次數與遺漏期數排序，不能預測或提高中獎機率。每期超級獎號為 01–80 中的一個號碼，公平隨機下單一號碼理論機率為 1/80。</div><p class="tiny">資料來源：已整理的台灣賓果開獎紀錄；超級獎號目前補齊最近 30 天。資料日期與期別以匯入檔為準。</p></div>
  <div class="cards"><div class="card"><div class="muted">已載入開獎期數</div><div class="metric" id="drawCount">—</div></div><div class="card"><div class="muted">已配對超級獎號</div><div class="metric" id="superCount">—</div></div><div class="card"><div class="muted">最新開獎期</div><div id="latest" class="muted">—</div><div id="latestBalls" class="balls"></div></div><div class="card"><div class="muted">下期超級獎號 5 碼候選</div><div id="superPicks" class="balls"></div></div></div>
  <div class="tabs" id="tabs"><button class="active" data-tab="overview">總覽</button><button data-tab="super">⭐ 超級獎號分析</button><button data-tab="history">📚 每期開獎紀錄</button><button data-tab="bingo">🎯 20 碼分析</button></div>
  <section id="overview"></section><section id="super" class="hidden"></section><section id="history" class="hidden"></section><section id="bingo" class="hidden"></section>
</main><footer>非台灣彩券官方網站｜統計僅供資料研究與娛樂參考｜不提供投注服務</footer>
<script>
"use strict";
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");let base=[],extra=[],draws=[];const DB="taiwan-bingo-super-v1",STORE="rows";
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"key"});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function getExtras(){try{const db=await openDB();return await new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}catch{return []}}
async function putExtras(rows){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite"),s=tx.objectStore(STORE);for(const row of rows)s.put(row);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return [];const header=lines[0].split(",").map(x=>x.trim().replace(/^"|"$/g,""));const hasHeader=/日期|date/i.test(header[0])||/期別|period/i.test(header[1]);const start=hasHeader?1:0;const rows=[];for(let i=start;i<lines.length;i++){const c=lines[i].split(",").map(x=>x.trim().replace(/^"|"$/g,""));if(c.length<23)continue;const date=(c[0]||"").slice(0,10),period=c[1]||"",superRaw=c[2]||"",nums=c.slice(3,23).map(Number);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||nums.length!==20||nums.some(n=>!Number.isInteger(n)||n<1||n>80)||new Set(nums).size!==20)continue;const sn=Number(superRaw);rows.push({key:period||date+"-"+i,date,period,superNumber:Number.isInteger(sn)&&sn>=1&&sn<=80?sn:null,numbers:nums.sort((a,b)=>a-b),source:"CSV"})}return rows}
function combine(){const m=new Map(base.map(d=>[d.key,d]));for(const d of extra){const p=m.get(d.key);m.set(d.key,p?{...p,...d,superNumber:d.superNumber??p.superNumber}:d)}draws=[...m.values()].sort((a,b)=>b.date.localeCompare(a.date)||String(b.period).localeCompare(String(a.period)))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function balls(ns,gold=false){return '<div class="balls">'+ns.map(n=>'<span class="ball '+(gold?'gold':'')+'">'+pad(n)+'</span>').join("")+'</div>'}function card(t,b){return '<div class="card"><h2>'+t+'</h2>'+b+'</div>'}
function superRows(){return draws.filter(d=>d.superNumber)}function rankSuper(){const ds=superRows();if(!ds.length)return [];const freq=Array(81).fill(0),recent=Array(81).fill(0);ds.forEach((d,i)=>{freq[d.superNumber]++;if(i<Math.min(100,ds.length))recent[d.superNumber]++});const gap=Array(81).fill(ds.length);for(let i=0;i<ds.length;i++)if(gap[ds[i].superNumber]===ds.length)gap[ds[i].superNumber]=i;const n100=Math.min(100,ds.length),total=ds.length;return Array.from({length:80},(_,i)=>{const n=i+1,score=(recent[n]/n100)*.65+(freq[n]/total)*.25+(Math.min(gap[n],100)/100)*.10;return {n,score,recent:recent[n],total:freq[n],gap:gap[n]}}).sort((a,b)=>b.score-a.score||a.n-b.n)}
function rankBingo(){const ds=draws.slice(0,300),f=Array(81).fill(0),r=Array(81).fill(0);ds.forEach((d,i)=>d.numbers.forEach(n=>{f[n]++;if(i<30)r[n]++}));return Array.from({length:80},(_,i)=>({n:i+1,score:(r[i+1]/Math.min(30,ds.length))*.7+(f[i+1]/Math.max(1,ds.length))*.3,count:f[i+1]})).sort((a,b)=>b.score-a.score||a.n-b.n)}
function render(){combine();const ss=superRows(),last=draws[0],sr=rankSuper(),br=rankBingo();$('drawCount').textContent=draws.length.toLocaleString();$('superCount').textContent=ss.length.toLocaleString();$('latest').textContent=last?last.date+'｜第'+(last.period||'—')+'期':'無資料';$('latestBalls').innerHTML=last?balls(last.numbers):'';$('superPicks').innerHTML=balls(sr.slice(0,5).map(x=>x.n),true);$('overview').innerHTML=card('⭐ 下期超級獎號 5 碼統計候選',balls(sr.slice(0,5).map(x=>x.n),true)+'<p class="muted">使用已配對超級獎號的近100期頻率、整體頻率及遺漏期數計算排序。每個號碼仍是隨機開出。</p>')+'<div class="split">'+card('最新一期20個號碼',last?balls(last.numbers):'尚無資料')+card('下期賓果20碼統計排序',balls(br.slice(0,20).map(x=>x.n)))+'</div><p class="muted">目前載入 '+draws.length.toLocaleString()+' 期開獎資料，配對 '+ss.length.toLocaleString()+' 期超級獎號。資料存放在此網站的資料檔；自行匯入的補充資料保存在這台裝置。</p>';renderSuper();renderHistory();renderBingo()}
function renderSuper(){const el=$('super'),ds=superRows(),r=rankSuper();if(!ds.length){el.innerHTML=card('超級獎號分析','目前沒有可用的超級獎號資料，請匯入含「超級獎號」欄位的 CSV。');return}const max=Math.max(...r.map(x=>x.total)),cells=r.map(x=>'<div class="heat '+(x.total>=max*.8?'hot':x.total<=max*.25?'cold':'')+'">'+pad(x.n)+'<small>'+x.total+'次</small></div>').join('');el.innerHTML=card('🎯 下期超級獎號 5 碼候選',balls(r.slice(0,5).map(x=>x.n),true)+'<p class="warn">候選只是歷史統計排序。每期超級獎號為單一號碼，任一號碼公平機率皆為 1/80；歷史頻率不會改變下期機率。</p><p class="muted">分析樣本 '+ds.length.toLocaleString()+' 期；資料日期 '+ds[ds.length-1].date+' 至 '+ds[0].date+'。</p>')+card('超級獎號熱度（全部已配對期數）','<div class="grid80">'+cells+'</div>')+card('號碼統計明細','<div class="scroll"><table><tr><th>排名</th><th>超級獎號</th><th>近100期</th><th>全部資料</th><th>遺漏期數</th><th>分數</th></tr>'+r.slice(0,30).map((x,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+pad(x.n)+'</b></td><td>'+x.recent+'</td><td>'+x.total+'</td><td>'+x.gap+'</td><td>'+x.score.toFixed(4)+'</td></tr>').join('')+'</table></div>')}
function renderHistory(){const ds=draws.filter(d=>d.superNumber);$('history').innerHTML=card('📚 每期開獎紀錄（共 '+draws.length.toLocaleString()+' 期；顯示最新500期）','<p class="muted">欄位中的「待補」表示該期尚未配對超級獎號。</p><div class="scroll"><table><tr><th>日期</th><th>期別</th><th>超級獎號</th><th>20個開出號碼</th></tr>'+draws.slice(0,500).map(d=>'<tr><td>'+esc(d.date)+'</td><td>'+esc(d.period||'—')+'</td><td>'+(d.superNumber?'<b>'+pad(d.superNumber)+'</b>':'待補')+'</td><td>'+d.numbers.map(pad).join(' ')+'</td></tr>').join('')+'</table></div>')}
function renderBingo(){const r=rankBingo(),ds=draws.slice(0,Math.min(100,draws.length));$('bingo').innerHTML=card('🎯 賓果20碼歷史統計候選',balls(r.slice(0,20).map(x=>x.n))+'<p class="muted">依最近30期頻率與最近最多300期整體頻率排序。僅描述歷史，不代表下一期命中機率較高。</p>')+card('最近'+ds.length+'期號碼分布','<div class="scroll"><table><tr><th>號碼</th><th>開出次數</th><th>相對頻率</th></tr>'+r.slice(0,30).map(x=>'<tr><td>'+pad(x.n)+'</td><td>'+x.count+'</td><td>'+((100*x.count/Math.max(1,ds.length)).toFixed(1))+'%</td></tr>').join('')+'</table></div>')}
async function load(){ $('status').textContent='正在讀取資料檔…';try{const res=await fetch('./history.csv',{cache:'no-store'});if(!res.ok)throw Error('找不到 data/history.csv（'+res.status+'）');base=parseCSV(await res.text());extra=await getExtras();render();$('status').textContent='載入完成：'+draws.length.toLocaleString()+'期｜超級獎號 '+superRows().length.toLocaleString()+'期'}catch(e){$('status').textContent='載入失敗：'+e.message;$('overview').innerHTML=card('資料尚未載入','<p>請確認 GitHub repository 根目錄有 index.html，並且有 data/history.csv。</p>')}}
async function importFile(file){if(!file)return;try{const incoming=parseCSV(await file.text());if(!incoming.length)throw Error('CSV格式不符。需要日期、期別、超級獎號及20個號碼欄位。');const map=new Map(extra.map(x=>[x.key,x]));for(const d of incoming)map.set(d.key,d);extra=[...map.values()];await putExtras(incoming);render();$('status').textContent='匯入完成：讀到 '+incoming.length.toLocaleString()+' 期，已有 '+superRows().length.toLocaleString()+' 期超級獎號'}catch(e){$('status').textContent='匯入失敗：'+e.message}}
function exportCSV(){const rows=[['日期','期別','超級獎號',...Array.from({length:20},(_,i)=>'號碼'+(i+1))].join(','),...draws.map(d=>[d.date,d.period,d.superNumber?pad(d.superNumber):'',...d.numbers.map(pad)].join(','))];const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='taiwan_bingo_super_history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$('reload').onclick=load;$('export').onclick=exportCSV;$('file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};$('tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab))};load();
</script>
</body></html>
